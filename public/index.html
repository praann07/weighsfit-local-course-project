<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeighsFit Local</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#667085; --line:#e2e6ee; --accent:#2f6df6; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2030; --text:#e8ecf5; --muted:#98a2b8; --line:#2b3248; --accent:#6c97ff; --bad:#ff7a6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  main { max-width:960px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  h1 { font-size:18px; margin:0; } h2 { font-size:16px; margin:0 0 10px; }
  input, select, textarea, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  button { cursor:pointer; background:var(--accent); color:#fff; border:0; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button.danger { background:var(--bad); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .row > input { flex:1; min-width:140px; }
  nav { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  nav button.active { background:var(--accent); color:#fff; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-word; }
  th { color:var(--muted); font-weight:600; }
  .scroll { overflow-x:auto; }
  .msg { color:var(--bad); min-height:1.2em; margin:6px 0 0; }
  .muted { color:var(--muted); }
  textarea { width:100%; min-height:90px; font-family:ui-monospace, monospace; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>WeighsFit Local <span class="muted">(MySQL course project)</span></h1>
  <div id="who" hidden><span id="whoText"></span> <button class="ghost" id="logoutBtn">Log out</button></div>
</header>
<main>

<section id="auth" class="card">
  <h2>Log in or sign up</h2>
  <div class="row">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
    <input id="fullName" placeholder="Full name (sign up only)">
  </div>
  <div class="row"><button id="loginBtn">Log in</button><button class="ghost" id="signupBtn">Sign up</button></div>
  <p class="msg" id="authMsg"></p>
</section>

<section id="app" hidden>
  <nav id="tabs"></nav>

  <div id="tab-weight" class="card">
    <h2>My weight (body_metrics)</h2>
    <div class="row"><input id="wDate" type="date"><input id="wKg" type="number" step="0.1" placeholder="Weight kg"><button id="wAdd">Add</button></div>
    <p class="msg" id="wMsg"></p>
    <div class="scroll"><table id="wTable"></table></div>
  </div>

  <div id="tab-workouts" class="card" hidden><h2>My workouts</h2><div class="scroll"><table id="woTable"></table></div></div>
  <div id="tab-food" class="card" hidden><h2>My daily calories and protein</h2><div class="scroll"><table id="foTable"></table></div></div>

  <div id="tab-users" class="card" hidden>
    <h2>Users (admin)</h2>
    <div class="row">
      <input id="nuEmail" type="email" placeholder="New user email">
      <input id="nuPass" type="text" placeholder="Password">
      <input id="nuName" placeholder="Full name">
      <select id="nuRole"><option value="user">user</option><option value="admin">admin</option></select>
      <button id="nuAdd">Add user</button>
    </div>
    <p class="msg" id="uMsg"></p>
    <div class="scroll"><table id="uTable"></table></div>
  </div>

  <div id="tab-tables" class="card" hidden>
    <h2>Browse a table (admin)</h2>
    <div class="row"><select id="tblName"></select><button id="tblLoad">Show</button></div>
    <div class="scroll"><table id="tblView"></table></div>
  </div>

  <div id="tab-sql" class="card" hidden>
    <h2>SQL box (admin, SELECT only)</h2>
    <textarea id="sql">SELECT p.full_name, COUNT(*) AS sessions FROM workout_sessions ws JOIN profiles p ON p.id = ws.user_id GROUP BY p.full_name;</textarea>
    <div class="row"><button id="sqlRun">Run</button></div>
    <p class="msg" id="sqlMsg"></p>
    <div class="scroll"><table id="sqlView"></table></div>
  </div>
</section>

</main>
<script>
const $ = (id) => document.getElementById(id);
let me = null;

async function api(url, method = 'GET', body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function esc(v) { return String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render(el, rows, actions) {
  if (!rows.length) { el.innerHTML = '<tr><td class="muted">No rows</td></tr>'; return; }
  const cols = Object.keys(rows[0]).filter((c) => !(actions && c === 'id'));
  el.innerHTML = '<thead><tr>' + cols.map((c) => `<th>${esc(c)}</th>`).join('') + (actions ? '<th></th>' : '') + '</tr></thead><tbody>' +
    rows.map((r, i) => '<tr>' + cols.map((c) => `<td>${esc(r[c])}</td>`).join('') + (actions ? `<td>${actions(r, i)}</td>` : '') + '</tr>').join('') + '</tbody>';
}

function showTab(name) {
  for (const t of ['weight', 'workouts', 'food', 'users', 'tables', 'sql']) $('tab-' + t).hidden = t !== name;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
  if (name === 'weight') loadWeight();
  if (name === 'workouts') api('/api/my/workouts').then((r) => render($('woTable'), r));
  if (name === 'food') api('/api/my/food').then((r) => render($('foTable'), r));
  if (name === 'users') loadUsers();
}

async function loadWeight() {
  const rows = await api('/api/my/weight');
  render($('wTable'), rows,
    (r) => `<button class="ghost" data-edit="${esc(r.id)}">Edit</button> <button class="danger" data-del="${esc(r.id)}">Delete</button>`);
}

async function loadUsers() {
  const rows = await api('/api/admin/users');
  render($('uTable'), rows, (r) =>
    `<button class="ghost" data-approve="${esc(r.id)}" data-value="${r.approved ? 0 : 1}">${r.approved ? 'Block' : 'Approve'}</button> ` +
    `<button class="danger" data-deluser="${esc(r.id)}">Delete</button>`);
}

function enter(user) {
  me = user;
  $('auth').hidden = true; $('app').hidden = false; $('who').hidden = false;
  $('whoText').textContent = `${user.full_name || user.email} (${user.role})`;
  const tabs = [['weight', 'My weight'], ['workouts', 'Workouts'], ['food', 'Food']];
  if (user.role === 'admin') tabs.push(['users', 'Users'], ['tables', 'Tables'], ['sql', 'SQL']);
  $('tabs').innerHTML = tabs.map(([k, l]) => `<button class="ghost" data-tab="${k}">${l}</button>`).join('');
  $('wDate').valueAsDate = new Date();
  if (user.role === 'admin') {
    $('tblName').innerHTML = ['users', 'profiles', 'exercises', 'routines', 'routine_exercises', 'workout_sessions', 'workout_sets',
      'foods', 'food_logs', 'nutrition_targets', 'body_metrics'].map((t) => `<option>${t}</option>`).join('');
  }
  showTab('weight');
}

async function authAction(path) {
  $('authMsg').textContent = '';
  try {
    const body = { email: $('email').value.trim(), password: $('password').value, full_name: $('fullName').value.trim() };
    const res = await api(path, 'POST', body);
    if (path === '/api/signup') { $('authMsg').textContent = ''; return enter(await api('/api/login', 'POST', body)); }
    enter(res);
  } catch (e) { $('authMsg').textContent = e.message; }
}

$('loginBtn').onclick = () => authAction('/api/login');
$('signupBtn').onclick = () => authAction('/api/signup');
$('logoutBtn').onclick = async () => { await api('/api/logout', 'POST'); location.reload(); };
$('tabs').onclick = (e) => { if (e.target.dataset.tab) showTab(e.target.dataset.tab); };

$('wAdd').onclick = async () => {
  $('wMsg').textContent = '';
  try { await api('/api/my/weight', 'POST', { log_date: $('wDate').value, weight_kg: $('wKg').value }); $('wKg').value = ''; loadWeight(); }
  catch (e) { $('wMsg').textContent = e.message; }
};

$('wTable').onclick = async (e) => {
  try {
    if (e.target.dataset.del) { await api('/api/my/weight/' + e.target.dataset.del, 'DELETE'); loadWeight(); }
    if (e.target.dataset.edit) {
      const v = prompt('New weight (kg)');
      if (v) { await api('/api/my/weight/' + e.target.dataset.edit, 'PUT', { weight_kg: v }); loadWeight(); }
    }
  } catch (err) { $('wMsg').textContent = err.message; }
};

$('nuAdd').onclick = async () => {
  $('uMsg').textContent = '';
  try {
    await api('/api/admin/users', 'POST', { email: $('nuEmail').value.trim(), password: $('nuPass').value, full_name: $('nuName').value.trim(), role: $('nuRole').value });
    $('nuEmail').value = $('nuPass').value = $('nuName').value = ''; loadUsers();
  } catch (e) { $('uMsg').textContent = e.message; }
};

$('uTable').onclick = async (e) => {
  try {
    if (e.target.dataset.approve) { await api(`/api/admin/users/${e.target.dataset.approve}/approved`, 'PUT', { approved: e.target.dataset.value === '1' }); loadUsers(); }
    if (e.target.dataset.deluser && confirm('Delete this user and all their data?')) { await api('/api/admin/users/' + e.target.dataset.deluser, 'DELETE'); loadUsers(); }
  } catch (err) { $('uMsg').textContent = err.message; }
};

$('tblLoad').onclick = () => api('/api/admin/table/' + $('tblName').value).then((r) => render($('tblView'), r)).catch((e) => alert(e.message));

$('sqlRun').onclick = async () => {
  $('sqlMsg').textContent = '';
  try { render($('sqlView'), await api('/api/admin/sql', 'POST', { sql: $('sql').value })); }
  catch (e) { $('sqlMsg').textContent = e.message; $('sqlView').innerHTML = ''; }
};

api('/api/me').then((u) => { if (u) enter(u); }).catch(() => {});
</script>
</body>
</html>
